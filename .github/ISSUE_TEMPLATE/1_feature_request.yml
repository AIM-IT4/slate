name: Feature request
description: Propose a useful workflow for Slate.
title: "[Feature]: "
body:
  - type: textarea
    id: workflow
    attributes:
      label: What do you want to accomplish on your phone?
      description: Describe the concrete workflow and what currently gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
      description: Share relevant links or redacted examples. Do not include private data.
  - type: checkboxes
    id: contribute
    attributes:
      label: I can help with
      options:
        - label: Testing on a real Android device
        - label: Documentation or design feedback
        - label: Implementation
