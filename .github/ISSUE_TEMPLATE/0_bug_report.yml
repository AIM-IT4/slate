name: Bug report
description: Help improve Slate with a reproducible Android issue.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please remove API keys, MCP headers, private conversations, and identifying information from logs and screenshots. Report vulnerabilities through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Slate version
      placeholder: "For example: 1.5.1 (14)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "For example: Pixel 8, Android 15"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Start with the screen you opened and describe each action.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted error
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant setup
      description: Provider/model, MCP server type, attachment format, network state, theme, or accessibility setting. Do not include credentials.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and removed private information.
          required: true
