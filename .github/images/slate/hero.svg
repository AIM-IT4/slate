<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="590" viewBox="0 0 1280 590" role="img" aria-labelledby="title desc">
<title id="title">Slate — Your models. Your tools. Your phone.</title>
<desc id="desc">An Android-first native AI workspace connecting a phone to model providers and remote MCP tools. Product architecture illustration, not a device screenshot.</desc>
<rect width="1280" height="590" rx="30" fill="#F7F5F1"/>
<rect x="58" y="54" width="205" height="34" rx="17" fill="#E5EAFF"/>
<text x="78" y="77" fill="#1748FF" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">AI, MADE MOBILE</text>
<text x="58" y="182" fill="#171A21" font-family="Georgia, serif" font-size="82" letter-spacing="-4">Slate</text>
<g fill="#171A21" font-family="Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-2">
<text x="61" y="276">Your models.</text><text x="61" y="338">Your tools.</text><text x="61" y="400">Your phone.</text>
</g>
<text x="62" y="460" fill="#555E6D" font-family="Arial, sans-serif" font-size="19">A native workspace for conversations,</text>
<text x="62" y="488" fill="#555E6D" font-family="Arial, sans-serif" font-size="19">connected tools, and the work in between.</text>
<g font-family="Arial, sans-serif">
