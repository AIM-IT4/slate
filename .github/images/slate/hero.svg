<text x="734" y="106" fill="#DCE5FF" font-size="12" font-weight="700" letter-spacing="2">ON YOUR PHONE</text>
<text x="734" y="143" fill="#FFFFFF" font-size="30" font-weight="700">Slate native app</text>
<text x="734" y="168" fill="#FFFFFF" font-size="15">Chat · files · voice · usage</text>
