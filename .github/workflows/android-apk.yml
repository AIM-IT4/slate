name: Android APK

# Builds the unsigned arm64 release APK described in SLATE.md and attaches it to the run.
# Sign it with your own keystore (zipalign + apksigner) before installing.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force > /dev/null || true
          sudo swapoff -a || true
          sudo fallocate -l 10G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 > /dev/null && sudo swapon /swapfile2
          df -h / && free -m

      # The first run's runner died mid-compile without logs (memory or disk). Log both every
      # two minutes so a repeat is visible.
      - name: Resource monitor
        run: nohup bash -c 'while true; do echo "[monitor] $(date -u +%H:%M) $(free -m | awk "/Mem/{print \"mem used \" \$3 \"/\" \$2 \" MB\"}") $(free -m | awk "/Swap/{print \"swap \" \$3 \" MB\"}") $(df -h / | awk "NR==2{print \"disk free \" \$4}")"; sleep 120; done' > "$RUNNER_TEMP/monitor.log" 2>&1 &

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.2.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Native design tokens
        run: node --import tsx packages/design-tokens/scripts/build-native-css.ts

      - uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned release APK
        working-directory: android
        env:
          # Fewer parallel native compiles keeps peak memory inside the 16 GB runner.
          CMAKE_BUILD_PARALLEL_LEVEL: 2
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m" -Dkotlin.daemon.jvm.options=-Xmx2g
        run: |
          ( while sleep 120; do tail -n 1 "$RUNNER_TEMP/monitor.log"; done ) &
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2

      - name: Resource history
        if: always()
        run: cat "$RUNNER_TEMP/monitor.log" || true

      - uses: actions/upload-artifact@v4
        with:
          name: slate-${{ github.sha }}-unsigned-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
