name: Android APK

# Builds the unsigned arm64 release APK described in SLATE.md and attaches it to the run.
# Sign it with your own keystore (zipalign + apksigner) before installing.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" && df -h /

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.2.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Native design tokens
        run: node --import tsx packages/design-tokens/scripts/build-native-css.ts

      - uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: slate-${{ github.sha }}-unsigned-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
